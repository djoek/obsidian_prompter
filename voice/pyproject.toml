[project]
name = "prompter-voice"
version = "0.1.0"
description = "Listens to a microphone and tells the Obsidian teleprompter which word you are saying."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "num2words>=0.5.14",
    "rapidfuzz>=3.10",
    "sounddevice>=0.5",
    "websockets>=14",
]

[project.optional-dependencies]
# The speech model. Separate, so the aligner and its tests run on any machine.
parakeet = ["parakeet-mlx>=0.3"]

[project.scripts]
prompter-voice = "prompter_voice.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
